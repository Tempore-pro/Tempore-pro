<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
<title id="t">Harrison Cross</title>
<desc id="d">A moonlit spirit forest: a glowing tree whose roots form a network, drifting wisps, and a swirling portal.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#061127"/><stop offset="0.55" stop-color="#0c2443"/><stop offset="1" stop-color="#16395a"/></linearGradient>
<radialGradient id="orbglow"><stop offset="0" stop-color="#9fd3ff" stop-opacity="0.55"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/></radialGradient>
<radialGradient id="treeglow"><stop offset="0" stop-color="#58d6c0" stop-opacity="0.45"/><stop offset="1" stop-color="#58d6c0" stop-opacity="0"/></radialGradient>
<radialGradient id="portalglow"><stop offset="0" stop-color="#7f77dd" stop-opacity="0.5"/><stop offset="1" stop-color="#7f77dd" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
<clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
</defs>
<style>
.twinkle{animation:tw 4s ease-in-out infinite}
.breathe{animation:br 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wisp{animation:rise 9s linear infinite}
.pulse{animation:pu 3s ease-in-out infinite}
.spin{animation:sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:sp 36s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.glowp{animation:gp 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes br{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}85%{opacity:.7}100%{transform:translate(18px,-120px);opacity:0}}
@keyframes pu{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes gp{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
